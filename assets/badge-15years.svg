<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <g filter="url(#badgeShadow)">
    <!-- Dark circular background with dashed gold border -->
    <circle cx="60" cy="56" r="48" fill="#090d16"/>
    <circle cx="60" cy="56" r="45" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="3.5 2" fill="none"/>
    <circle cx="60" cy="56" r="40" stroke="url(#goldGrad)" stroke-width="1.5" fill="none"/>

    <!-- 3 Stars on top -->
    <g fill="url(#goldGrad)">
      <polygon points="60,18 61.8,22.2 66,22.5 62.7,25.5 63.8,29.8 60,27 56.2,29.8 57.3,25.5 54,22.5 58.2,22.2"/>
      <polygon points="46,21 47.5,24.5 51,24.7 48.3,27.2 49.2,30.7 46,28.5 42.8,30.7 43.7,27.2 41,24.7 44.5,24.5"/>
      <polygon points="74,21 75.5,24.5 79,24.7 76.3,27.2 77.2,30.7 74,28.5 70.8,30.7 71.7,27.2 69,24.7 72.5,24.5"/>
    </g>

    <!-- Left Laurel Leaf Swirls -->
    <path d="M26 42 C18 48 18 64 26 72 M20 56 C28 56 28 56 20 56 M24 46 C16 42 20 34 28 38 M22 66 C14 66 14 56 24 58" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Right Laurel Leaf Swirls -->
    <path d="M94 42 C102 48 102 64 94 72 M100 56 C92 56 92 56 100 56 M96 46 C104 42 100 34 92 38 M98 66 C106 66 106 56 96 58" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Large Bold 15 -->
    <text x="60" y="58" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="url(#goldGrad)">15</text>
    
    <!-- YEARS -->
    <text x="60" y="72" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="10" fill="#ffffff" letter-spacing="1.5">YEARS</text>

    <!-- EXPERIENCE (Cleanly inside with zero overlap) -->
    <rect x="25" y="78" width="70" height="13" rx="6.5" fill="#090d16" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <text x="60" y="87" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="7" fill="url(#goldGrad)" letter-spacing="1.2">EXPERIENCE</text>
  </g>
</svg>
